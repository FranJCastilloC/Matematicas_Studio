# Biblioteca de matematicas en produccion.
#   web: Caddy sirve las paginas y los PDF, pone HTTPS y la contrasena.
#   app: guarda el progreso de estudio y su historial en SQLite.
# Se levanta desde esta carpeta con: docker compose up -d --build

services:
  web:
    build:
      context: ..
      dockerfile: despliegue/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PUERTO_HTTP:-80}:80"
      - "${PUERTO_HTTPS:-443}:443"
    volumes:
      - ./pdfs:/srv/pdf:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: ..
      dockerfile: despliegue/app/Dockerfile
    restart: unless-stopped
    volumes:
      - ./datos:/datos

volumes:
  caddy_datos:
  caddy_config:
